# Local development only: test credentials, synthetic data, port bound to localhost.
# Spring Boot starts this file on bootRun (spring-boot-docker-compose).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: koine
      POSTGRES_USER: koine
      POSTGRES_PASSWORD: koine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koine -d koine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
