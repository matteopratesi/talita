<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Accedi · Talità</title>
<link rel="stylesheet" href="talita-15.css">
</head>
<body>
<!-- Mockup statico di TALITA-15: dati e testi sintetici, nessuna risorsa esterna. Criterio 22. Il telefono chiede la conferma: il bottone è disabilitato, con rotella e testo; la riga sotto è una regione che si annuncia. -->
<a class="skip-link" href="#contenuto">Vai al contenuto</a>
<header class="app-header app-header--public"><span class="wordmark wordmark--static"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M10.5 9h11M16 9v14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Talità</span></span></header>
<main id="contenuto" tabindex="-1" class="main--public">
  <div class="container container--narrow">
    <div class="page-head">
      <h1 class="page-title" tabindex="-1">Accedi a Talità</h1>
      <p class="lead">Ti mandiamo un link per entrare, senza password. Se è la prima volta, va bene lo stesso: non devi creare niente.</p>
    </div>
    <form class="card" method="post" action="../TALITA-3/controlla-la-posta.html" novalidate>
      <div class="field">
        <label class="label" for="email">Indirizzo email</label>
        <p class="hint" id="email-aiuto">Usa sempre lo stesso indirizzo: è il tuo accesso a Talità.</p>
        <input class="input" id="email" name="email" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="email-aiuto">
      </div>
      <div class="form-actions"><button class="btn btn--primary btn--wide" type="submit">Ricevi il link</button></div>
    </form>
    <div class="passkey" data-passkey><p class="or" aria-hidden="true">oppure</p><button class="btn btn--secondary btn--wide is-busy" type="button" disabled><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>In attesa della conferma…</button><p class="hint passkey__help" role="status">Conferma con l’impronta, il volto o il codice di sblocco.</p></div>
  </div>
</main>
</body>
</html>
