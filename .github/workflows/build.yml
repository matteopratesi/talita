name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Any step that hangs (a download, a container that does not start) ends here and not after the 6
    # hours that GitHub allows by default. The build takes about 6 minutes; the first run without
    # caches (Chromium, Gradle dependencies, the Postgres image) stays well under 30.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the check of the commit addresses below.
          fetch-depth: 0
          # The job only reads the repository: the token must not stay in the git config, where
          # the Gradle plugins, the dependencies and the tests that run later could read it.
          persist-credentials: false
      # The repository is public: no commit of a pull request may carry a personal or a work email.
      - name: Commit addresses
        if: github.event_name == 'pull_request'
        run: ./scripts/check-commit-emails.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      # Validates the wrapper jar. Basic caching is the MIT-licensed provider, no proprietary component.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # Chromium for the e2e tests. The browsers are cached by Playwright version (read from the
      # build script, so the key follows the version); the system libraries are installed every run.
      - id: playwright
        run: echo "version=$(sed -n 's/^val playwrightVersion = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium-${{ runner.os }}
      - run: ./gradlew playwrightInstall -PplaywrightWithDeps
      # Tests use Testcontainers with the runner's Docker. `build` runs the unit tests and the e2e
      # tests (check depends on e2eTest): an e2e failure fails the build.
      - run: ./gradlew build
      # The production jar starts without profiles and serves the precompiled templates (KOINE-11).
      - run: ./scripts/smoke-test-jar.sh
      # Trace and screenshot of every failed e2e test, only on failure and for at most 7 days.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-failures
          path: build/e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore
