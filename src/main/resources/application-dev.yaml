# Profile used by bootRun (see build.gradle.kts).
server:
  # Not 8080, so that this app and another one on the same PC can run together.
  port: 8081

spring:
  mail:
    # The Mailpit of compose.yaml: it catches every mail and shows it at http://localhost:8026.
    # Ports 1026 and 8026, not the usual 1025 and 8025, which belong to another project on the same PC.
    host: 127.0.0.1
    port: 1026
    properties:
      mail:
        smtp:
          starttls:
            enable: false
            required: false
  web:
    resources:
      # The CSS is served straight from build/, where `./gradlew tailwindWatch` rewrites it
      # on every change, before the copy that processResources puts in build/resources.
      static-locations:
        - file:build/generated-resources/tailwind/static/
        - classpath:/static/
      chain:
        cache: false

talita:
  # The links in the mails start with this address (in production TALITA_PUBLIC_URL).
  public-url: http://localhost:8081
  bootstrap:
    # The first teacher: with no teacher yet, this address is invited at the start (no mail).
    # It enters from /accedi (the link arrives in Mailpit) and accepts the invitation.
    teacher: nome@example.org
  mail:
    from: nome@example.org
  privacy:
    # The controller of the data, as the notices say it: placeholders (in production TALITA_PRIVACY_CONTROLLER_NAME and TALITA_PRIVACY_CONTACT,
    # with no default: without them the application does not start).
    controller-name: Titolare di esempio
    contact: nome@example.org

gg:
  jte:
    # JTE reads the templates from src/main/jte and recompiles them when they change.
    use-precompiled-templates: false
    development-mode: true
